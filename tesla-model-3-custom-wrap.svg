<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200" width="2000" height="1200">
  <defs>
    <!-- Base gradients -->
    <linearGradient id="creamBase" x1="0" x2="1">
      <stop offset="0%" stop-color="#e8e4da"/>
      <stop offset="50%" stop-color="#f5f1e8"/>
      <stop offset="100%" stop-color="#ddd9cf"/>
    </linearGradient>
    
    <linearGradient id="creamToBlack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0ebe2"/>
      <stop offset="40%" stop-color="#a8a8a8"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>

    <radialGradient id="faceGradient" cx="50%" cy="45%">
      <stop offset="0%" stop-color="#e5e2db"/>
      <stop offset="35%" stop-color="#8a8d92"/>
      <stop offset="70%" stop-color="#3a3d42"/>
      <stop offset="100%" stop-color="#0d0e10"/>
    </radialGradient>

    <!-- Noise/texture filters -->
    <filter id="grainTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="2" />
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Patterns for shoe design elements -->
    <pattern id="bandannaPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="8" fill="#c4b5a0" opacity="0.4"/>
      <circle cx="20" cy="20" r="5" fill="#9b8b76" opacity="0.3"/>
    </pattern>

    <pattern id="sprayOverlay" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="3" fill="#000" opacity="0.15"/>
      <circle cx="45" cy="25" r="2" fill="#000" opacity="0.12"/>
      <circle cx="25" cy="50" r="2.5" fill="#000" opacity="0.13"/>
      <circle cx="55" cy="55" r="2" fill="#000" opacity="0.14"/>
    </pattern>
  </defs>

  <!-- Base cream wrap -->
  <rect width="2000" height="1200" fill="url(#creamBase)"/>

  <!-- Bandanna undertone (full body) -->
  <rect width="2000" height="1200" fill="url(#bandannaPattern)" opacity="0.6"/>

  <!-- Car body shape -->
  <g id="carBody">
    <!-- Main body -->
    <path d="M 200 800 L 400 500 Q 600 350 1000 330 Q 1400 350 1600 500 L 1800 800 L 1850 950 L 1900 1000 L 100 1000 L 150 950 Z" 
          fill="url(#creamBase)" stroke="none"/>

    <!-- Roof line -->
    <path d="M 450 500 L 700 400 L 1300 400 L 1550 500" 
          fill="url(#creamBase)" opacity="0.9" stroke="none"/>

    <!-- Hood (main focus for face) -->
    <path d="M 500 550 L 800 420 L 1200 420 L 1500 550 L 1480 700 L 520 700 Z" 
          fill="url(#creamBase)" stroke="none" filter="url(#softGlow)"/>
  </g>

  <!-- EXACT FACE FROM SHOE - Centered on hood -->
  <g id="mainFace" transform="translate(1000, 520)" filter="url(#grainTexture)">
    <!-- Face oval base -->
    <ellipse cx="0" cy="0" rx="280" ry="240" fill="url(#faceGradient)" stroke="#1a1a1a" stroke-width="8"/>

    <!-- Left eye (large, intense) -->
    <ellipse cx="-120" cy="-80" rx="65" ry="85" fill="#0d0e10" opacity="0.95"/>
    <ellipse cx="-120" cy="-80" rx="45" ry="60" fill="#1a1d22" opacity="0.8"/>
    <circle cx="-110" cy="-85" r="20" fill="#f0f0f0" opacity="0.4"/>

    <!-- Right eye (matching) -->
    <ellipse cx="120" cy="-80" rx="65" ry="85" fill="#0d0e10" opacity="0.95"/>
    <ellipse cx="120" cy="-80" rx="45" ry="60" fill="#1a1d22" opacity="0.8"/>
    <circle cx="130" cy="-85" r="20" fill="#f0f0f0" opacity="0.4"/>

    <!-- Nose (defined, centered) -->
    <path d="M 0 -40 L -25 40 Q 0 65 25 40 Z" fill="#0a0a0b" opacity="0.9" stroke="#000" stroke-width="2"/>
    <path d="M -8 35 L 0 50 L 8 35" fill="#1a1a1a" opacity="0.7"/>

    <!-- Mouth (subtle, artistic) -->
    <path d="M -90 120 Q 0 160 90 120 Q 60 155 0 170 Q -60 155 -90 120 Z" 
          fill="#0d0e0f" opacity="0.85" stroke="#000" stroke-width="3"/>

    <!-- Cheekbones and facial contour -->
    <ellipse cx="-160" cy="-20" rx="80" ry="100" fill="none" stroke="#5a5d62" stroke-width="6" opacity="0.6"/>
    <ellipse cx="160" cy="-20" rx="80" ry="100" fill="none" stroke="#5a5d62" stroke-width="6" opacity="0.6"/>

    <!-- Forehead highlight -->
    <ellipse cx="0" cy="-140" rx="200" ry="80" fill="#b8b9ba" opacity="0.25"/>

    <!-- Chin shadow -->
    <ellipse cx="0" cy="180" rx="220" ry="60" fill="#000" opacity="0.3"/>

    <!-- Bandanna texture around face (patterned background) -->
    <g opacity="0.4">
      <circle cx="-280" cy="-100" r="25" fill="#c4b5a0"/>
      <circle cx="-260" cy="100" r="20" fill="#c4b5a0"/>
      <circle cx="280" cy="-100" r="25" fill="#c4b5a0"/>
      <circle cx="260" cy="100" r="20" fill="#c4b5a0"/>
      <circle cx="-180" cy="-220" r="18" fill="#c4b5a0"/>
      <circle cx="180" cy="-220" r="18" fill="#c4b5a0"/>
      <circle cx="0" cy="240" r="22" fill="#c4b5a0"/>
    </g>
  </g>

  <!-- Full body black overspray effect -->
  <rect width="2000" height="1200" fill="url(#sprayOverlay)"/>
  
  <!-- Additional black overspray layers -->
  <g opacity="0.08" fill="#000000">
    <circle cx="300" cy="200" r="40"/>
    <circle cx="1700" cy="300" r="45"/>
    <circle cx="400" cy="900" r="35"/>
    <circle cx="1600" cy="950" r="40"/>
    <circle cx="1000" cy="1150" r="50"/>
    <circle cx="200" cy="600" r="30"/>
    <circle cx="1850" cy="700" r="35"/>
  </g>

  <!-- Side panel detail (bandanna + overspray) -->
  <g opacity="0.5">
    <rect x="0" y="400" width="400" height="500" fill="url(#bandannaPattern)"/>
    <rect x="1600" y="400" width="400" height="500" fill="url(#bandannaPattern)"/>
  </g>

  <!-- Overspray side effects -->
  <g opacity="0.12" fill="#000">
    <rect x="0" y="500" width="350" height="400" fill="url(#sprayOverlay)"/>
    <rect x="1650" y="500" width="350" height="400" fill="url(#sprayOverlay)"/>
  </g>

  <!-- Lower body black overspray concentration -->
  <path d="M 0 850 L 2000 850 L 2000 1200 L 0 1200 Z" 
        fill="#000000" opacity="0.06"/>
  <rect width="2000" height="1200" fill="url(#sprayOverlay)" opacity="0.8"/>

  <!-- Vans logo placement (subtle, like on shoe) -->
  <g transform="translate(1900, 1050)">
    <rect width="80" height="100" fill="none" stroke="#1a1a1a" stroke-width="4" rx="4"/>
    <path d="M 10 30 L 35 70 L 60 30 M 20 60 L 50 60" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Additional face detail - eyes gaze direction -->
  <g id="eyeGaze" transform="translate(1000, 520)" opacity="0.15">
    <ellipse cx="-120" cy="-80" rx="55" ry="70" fill="#000"/>
    <ellipse cx="120" cy="-80" rx="55" ry="70" fill="#000"/>
  </g>
</svg>