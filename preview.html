<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tesla Model 3 Custom Wrap Mockup</title>
    <style>
      :root {
        --bg: #f4f1ea;
        --panel: #ebe7e1;
        --text: #1f1f22;
        --muted: #595d63;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .wrap {
        width: min(90vw, 1200px);
        background: rgba(255,255,255,0.28);
        border: 1px solid rgba(0,0,0,0.08);
        border-radius: 18px;
        box-shadow: 0 18px 34px rgba(0,0,0,0.08);
        overflow: hidden;
      }

      .frame {
        padding: 24px;
        background: var(--panel);
      }

      img {
        width: 100%;
        display: block;
        border-radius: 12px;
      }

      .meta {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding: 16px 10px 4px;
        font-size: 13px;
        color: var(--muted);
      }

      .meta strong {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="frame">
        <img src="./tesla-model-3-custom-wrap.svg" alt="Tesla Model 3 custom wrap concept" />
      </div>
      <div class="meta">
        <div><strong>Wrap concept:</strong> Monochrome Portrait Tesla Model 3</div>
        <div><strong>Style:</strong> Black / ivory / smoky silver</div>
      </div>
    </div>
  </body>
</html>
